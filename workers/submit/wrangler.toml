# AIx submission Worker (ADR-0004). Deploy: `bun run deploy` (from this dir).
# Secret (set once): `wrangler secret put GITHUB_TOKEN` — a token with
# contents:write on the repo below.
name = "aix-submit"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[vars]
GITHUB_REPO = "trevormil/ai-tools-evaluator"
GITHUB_BRANCH = "main"
ALLOWED_ORIGIN = "https://aix.trevormil.com"
