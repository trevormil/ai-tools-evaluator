name: AIx
options:
  bundleIdPrefix: com.trevormil
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # Set your Apple Developer team id here (or in Xcode's Signing pane) for
    # device/TestFlight builds; simulator builds and tests need no signing.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  AIx:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AIx
    info:
      path: AIx/Info.plist
      properties:
        CFBundleDisplayName: AIx
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.developer-tools
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.trevormil.aix.auth
            CFBundleURLSchemes:
              - aix
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trevormil.aix
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  AIxTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AIxTests
    dependencies:
      - target: AIx
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trevormil.aix.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AIx:
    build:
      targets:
        AIx: all
        AIxTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AIxTests
    archive:
      config: Release
