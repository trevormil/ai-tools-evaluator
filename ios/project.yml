name: AIx
options:
  bundleIdPrefix: com.trevormil
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # Apple Developer team id. Also read by scripts/testflight.sh, which
    # generates ExportOptions.plist from it — keep this the only copy.
    DEVELOPMENT_TEAM: "8UWQ486J94"
    CODE_SIGN_STYLE: Automatic
targets:
  AIx:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AIx
    info:
      path: AIx/Info.plist
      properties:
        CFBundleDisplayName: AIx
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trevormil.aix
        GENERATE_INFOPLIST_FILE: NO
        # iPhone only. Shipping iPad would require a separate 13" screenshot set
        # and an iPad layout pass; add it back deliberately, not by default.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  # AIxShare (share extension, ticket 0072) is PARKED until the paid Apple
  # Developer enrollment: free personal teams can't provision the App Group
  # entitlement it needs (verified 2026-07-20). The code lives in AIxShare/;
  # to enable, restore this target + `dependencies: [target: AIxShare,
  # embed: true]` on AIx + CODE_SIGN_ENTITLEMENTS on both targets, and flip
  # FavoritesStore.sharedDefaults() to the app-group suite:
  #
  # AIxShare:
  #   type: app-extension
  #   platform: iOS
  #   deploymentTarget: "17.0"
  #   sources: [{path: AIxShare, excludes: ["*.entitlements"]}]
  #   info:
  #     path: AIxShare/Info.plist
  #     properties:
  #       CFBundleDisplayName: Save to AIx
  #       NSExtension:
  #         NSExtensionPointIdentifier: com.apple.share-services
  #         NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
  #         NSExtensionAttributes:
  #           NSExtensionActivationRule:
  #             NSExtensionActivationSupportsWebURLWithMaxCount: 1
  #             NSExtensionActivationSupportsWebPageWithMaxCount: 1
  #   settings:
  #     base:
  #       PRODUCT_BUNDLE_IDENTIFIER: com.trevormil.aix.share
  #       GENERATE_INFOPLIST_FILE: NO
  #       SKIP_INSTALL: YES
  #       CODE_SIGN_ENTITLEMENTS: AIxShare/AIxShare.entitlements
  AIxTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AIxTests
    dependencies:
      - target: AIx
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trevormil.aix.tests
        GENERATE_INFOPLIST_FILE: YES
  # Store screenshots only — drives the real app against the live API, so it is
  # deliberately NOT in the AIx scheme's test action (slow, network-dependent).
  AIxUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AIxUITests
    dependencies:
      - target: AIx
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trevormil.aix.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AIx
schemes:
  AIx:
    build:
      targets:
        AIx: all
        AIxTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AIxTests
    archive:
      config: Release
  AIxScreenshots:
    build:
      targets:
        AIx: all
        AIxUITests: [test]
    test:
      config: Debug
      targets:
        - AIxUITests
