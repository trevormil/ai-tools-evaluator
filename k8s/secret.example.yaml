# TEMPLATE ONLY — do NOT commit real values, and do NOT include this file in
# kustomization.yaml. The real `aix-secrets` Secret is applied out-of-band by an
# operator (see k8s/README.md), never checked into git.
#
# Create the real secret with either:
#   kubectl -n aix apply -f <your-filled-copy>.yaml     # (keep it out of git)
# or imperatively from env/files:
#   kubectl -n aix create secret generic aix-secrets \
#     --from-literal=ANTHROPIC_API_KEY=... \
#     --from-literal=GITHUB_TOKEN=... \
#     --from-literal=AIX_INTERNAL_TOKEN=... \
#     --from-literal=GITHUB_OAUTH_CLIENT_ID=... \
#     --from-literal=GITHUB_OAUTH_CLIENT_SECRET=... \
#     --from-literal=DISCORD_TOKEN=... \
#     --from-literal=DISCORD_APP_ID=... \
#     --from-literal=DISCORD_DIGEST_CHANNEL_ID=...
apiVersion: v1
kind: Secret
metadata:
  name: aix-secrets
  namespace: aix
type: Opaque
stringData:
  # Claude API key — used by the scanner to evaluate items.
  ANTHROPIC_API_KEY: "REPLACE_ME"
  # GitHub API token (Octokit) — trending discovery, README fetch.
  GITHUB_TOKEN: "REPLACE_ME"
  # Shared bearer token guarding /api/internal/* (web validates; scanner+bot send).
  AIX_INTERNAL_TOKEN: "REPLACE_ME"
  # GitHub OAuth app credentials — web sign-in.
  GITHUB_OAUTH_CLIENT_ID: "REPLACE_ME"
  GITHUB_OAUTH_CLIENT_SECRET: "REPLACE_ME"
  # Discord bot credentials.
  DISCORD_TOKEN: "REPLACE_ME"
  DISCORD_APP_ID: "REPLACE_ME"
  # Channel the bot posts the daily digest to.
  DISCORD_DIGEST_CHANNEL_ID: "REPLACE_ME"
  # Newsletter (Resend free tier). Leave RESEND_API_KEY empty to disable sending.
  RESEND_API_KEY: "REPLACE_ME"
  NEWSLETTER_FROM: "AIx <newsletter@aix.trevormil.com>"
  AIX_PUBLIC_URL: "https://aix.trevormil.com"
  AIX_SPACES_ENDPOINT: "https://nyc3.digitaloceanspaces.com"
  AIX_SPACES_REGION: "nyc3"
  AIX_SPACES_BUCKET: "aix-trevormil-media"
  AIX_SPACES_KEY: "REPLACE_ME"
  AIX_SPACES_SECRET: "REPLACE_ME"
  AIX_MEDIA_BASE_URL: "https://aix-trevormil-media.nyc3.cdn.digitaloceanspaces.com"
