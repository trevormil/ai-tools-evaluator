apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The `aix-secrets` Secret is applied out-of-band (see README.md) and is
# intentionally NOT listed here so real credentials never live in git. The GHCR
# images are public, so no imagePullSecret is needed.
resources:
  - namespace.yaml
  - pvc.yaml
  - web-deployment.yaml
  - web-service.yaml
  - web-ingress.yaml
  - scanner-cronjob.yaml
  - queue-cronjob.yaml
  - bot-state-pvc.yaml
  - bot-deployment.yaml
  - rank-cronjob.yaml
