apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The `aix-secrets` Secret and the `ghcr-pull` imagePullSecret are applied
# out-of-band (see README.md) and are intentionally NOT listed here so real
# credentials never live in git.
resources:
  - namespace.yaml
  - pvc.yaml
  - web-deployment.yaml
  - web-service.yaml
  - web-ingress.yaml
  - scanner-cronjob.yaml
  - bot-deployment.yaml
  - newsletter-cronjob.yaml
  - rank-cronjob.yaml
