apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aix-db
  namespace: aix
  labels:
    app: aix-web
spec:
  # ReadWriteOnce enforces the single-writer rule: only the one aix-web pod
  # (replicas: 1) mounts this volume and owns the SQLite file.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
