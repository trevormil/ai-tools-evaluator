apiVersion: apps/v1
kind: Deployment
metadata:
  name: aix-bot
  namespace: aix
  labels:
    app: aix-bot
spec:
  replicas: 1
  # Recreate (not RollingUpdate): never run two bot pods at once — a second
  # Discord gateway connection would double-post the daily digest.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aix-bot
  template:
    metadata:
      labels:
        app: aix-bot
    spec:
      containers:
        - name: bot
          image: ghcr.io/trevormil/aix-bot:latest
          imagePullPolicy: Always
          env:
            # Reach web's internal API over the cluster DNS name.
            - name: AIX_WEB_URL
              value: http://aix-web.aix.svc.cluster.local
            # Durable digest watermark lives on the PVC below.
            - name: AIX_BOT_STATE_DIR
              value: /state
          envFrom:
            # Supplies DISCORD_TOKEN, DISCORD_APP_ID, AIX_INTERNAL_TOKEN, …
            - secretRef:
                name: aix-secrets
          volumeMounts:
            - name: bot-state
              mountPath: /state
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: bot-state
          persistentVolumeClaim:
            claimName: aix-bot-state
      imagePullSecrets:
        - name: ghcr-pull
