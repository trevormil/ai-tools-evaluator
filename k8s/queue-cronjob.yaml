apiVersion: batch/v1
kind: CronJob
metadata:
  name: aix-queue
  namespace: aix
  labels:
    app: aix-queue
spec:
  # Every 2 minutes: drain the human link-drop submission queue promptly.
  schedule: "*/2 * * * *"
  # Circuit breaker #1: never overlap a run (no double-processing a submission).
  # A long run (5 submissions ≈ 50s each) simply skips ticks until it finishes.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # Circuit breaker #2: bail a stuck run well under the 5-min interval.
      activeDeadlineSeconds: 240
      template:
        metadata:
          labels:
            app: aix-queue
        spec:
          restartPolicy: Never
          containers:
            - name: queue
              image: ghcr.io/trevormil/aix-scanner:latest
              imagePullPolicy: Always
              env:
                - name: AIX_WEB_URL
                  value: http://aix-web.aix.svc.cluster.local
                # Queue-only: no trending discovery, just drain submissions.
                - name: AIX_TRENDING_PICKS
                  value: "0"
                # Circuit breaker #3: at most 5 submissions processed per run
                # (also bounded by the server's daily cap remaining).
                - name: AIX_DAILY_CAP
                  value: "5"
              envFrom:
                - secretRef:
                    name: aix-secrets
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  # Same image + eval/image work as the scanner; match its 1Gi
                  # so draining submissions never OOMs mid-evaluation.
                  memory: 1Gi
          imagePullSecrets:
            - name: ghcr-pull
