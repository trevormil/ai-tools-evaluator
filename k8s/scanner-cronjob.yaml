apiVersion: batch/v1
kind: CronJob
metadata:
  name: aix-scanner
  namespace: aix
  labels:
    app: aix-scanner
spec:
  # Daily at 12:30 UTC. Runs the discovery + evaluation pipeline once.
  #
  # This must finish BEFORE the bot's 13:00 UTC digest gate
  # (DEFAULT_DIGEST_UTC_HOUR), so the pick is already published when the gate
  # opens and the post lands at 13:0x UTC — 6:02am PT — every day. The 30-min
  # lead matches this job's own activeDeadlineSeconds. Enforced by
  # apps/bot/src/schedule-contract.test.ts.
  schedule: "30 12 * * *"
  # Explicit — without it k8s resolves the schedule in kube-controller-manager's
  # local time, which on single-node k3s is the host clock (America/New_York).
  # That silently ran this job at 17:00 UTC until 2026-08-27.
  timeZone: "Etc/UTC"
  # Never overlap a previous run (rate-limit + daily-cap accounting rely on it).
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # Give up a stuck run after 30 min rather than blocking the next day.
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: aix-scanner
        spec:
          restartPolicy: Never
          containers:
            - name: scanner
              image: ghcr.io/trevormil/aix-scanner:latest
              imagePullPolicy: Always
              env:
                # Reach web's internal API over the cluster DNS name.
                - name: AIX_WEB_URL
                  value: http://aix-web.aix.svc.cluster.local
                # Daily mix: 5 GitHub + 5 ProductHunt (per-source defaults), master
                # cap 10, bounded by the server's DAILY_CAP=10. ProductHunt runs only
                # when PRODUCTHUNT_API_TOKEN is present in aix-secrets; otherwise the
                # scan is GitHub-only. The single Discord "pick of the day" is chosen
                # downstream by the digest (highest score across all sources).
                - name: AIX_TRENDING_PICKS
                  value: "10"
              envFrom:
                # Supplies AIX_INTERNAL_TOKEN, ANTHROPIC_API_KEY, GITHUB_TOKEN,
                # PRODUCTHUNT_API_TOKEN (optional), …
                - secretRef:
                    name: aix-secrets
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  # Discovery + LLM eval + README/avatar image processing spikes
                  # past 512Mi; 1Gi so a heavy run never OOMs and drops picks.
                  memory: 1Gi
