apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aix-bot-state
  namespace: aix
  labels:
    app: aix-bot
spec:
  # Tiny RWO volume for the bot's durable digest watermark (.state.json) so the
  # daily pick is posted exactly once, even across restarts.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi
